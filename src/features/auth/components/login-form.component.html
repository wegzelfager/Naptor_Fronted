<div class="w-full max-w-md p-8 md:p-10 bg-slate-900/90 border border-slate-800/80 rounded-2xl shadow-2xl backdrop-blur-xl space-y-6">
  <!-- Title Header -->
  <div class="space-y-2 text-center">
    <h1 class="text-3xl font-extrabold tracking-tight text-white">Welcome Back</h1>
    <p class="text-sm text-slate-400">Sign in to manage your monitors and infrastructure</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Email Address</label>
      <app-input
        type="email"
        placeholder="admin@naptor.io"
        formControlName="email"
      ></app-input>
    </div>

    <div class="space-y-1.5">
      <div class="flex items-center justify-between">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
        <a routerLink="/forgot-password" class="text-xs text-blue-400 hover:text-blue-300 transition-colors font-medium">Forgot password?</a>
      </div>
      <app-input
        type="password"
        placeholder="••••••••••••"
        formControlName="password"
      ></app-input>
    </div>

    <div *ngIf="error()" class="flex items-center space-x-2 text-sm text-red-400 bg-red-950/40 border border-red-800/60 p-3.5 rounded-xl">
      <i class="fa-solid fa-circle-exclamation text-red-400"></i>
      <span>{{ error() }}</span>
    </div>

    <app-button
      type="submit"
      [disabled]="form.invalid || submitting()"
    >
      <i *ngIf="submitting()" class="fa-solid fa-spinner animate-spin mr-2"></i>
      <span>{{ submitting() ? 'Signing in...' : 'Sign In to Dashboard' }}</span>
    </app-button>
  </form>

  <div class="pt-4 border-t border-slate-800/80 text-center">
    <p class="text-sm text-slate-400">
      Don't have an account?
      <a routerLink="/register" class="font-semibold text-blue-400 hover:text-blue-300 hover:underline transition-colors ml-1">
        Create account
      </a>
    </p>
  </div>
</div>
